name: Check Website Demo
on:
  push:
    branches: [main]
    paths:
      - "website-demo-builder/**"
      - "tests/demo-check.mjs"
      - "tests/demo-submission-flow.mjs"
      - ".github/workflows/demo-check.yml"
  pull_request:
    paths:
      - "website-demo-builder/**"
      - "tests/demo-check.mjs"
      - "tests/demo-submission-flow.mjs"
      - ".github/workflows/demo-check.yml"

permissions:
  contents: read

jobs:
  demo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check demo JavaScript and integration
        run: |
          node tests/demo-check.mjs
          node tests/demo-submission-flow.mjs
      - name: Diagnose live site origin and script
        if: github.ref == 'refs/heads/main'
        run: |
          echo "DNS records for app.zionflow.co.za:"
          (getent ahostsv4 app.zionflow.co.za || true) | head -3
          echo "Response headers (non-sensitive):"
          curl --location --silent --show-error --max-time 20 --dump-header /tmp/zf-live-headers.txt \
            "https://app.zionflow.co.za/website-demo-builder/share.js?deploydiag=$(date +%s)" \
            --output /tmp/zf-live-diag.js || true
          grep -Ei '^(HTTP/|server:|date:|last-modified:|etag:|cache-control:|cf-cache-status:|location:)' /tmp/zf-live-headers.txt || true
          echo "Live script bytes and known markers:"
          wc -c /tmp/zf-live-diag.js || true
          grep -oE '(ZIONFLOW_WHATSAPP_NUMBER|SUBMISSION_ENDPOINT|function requestDemo|form.submit\(\))' /tmp/zf-live-diag.js | sort -u || true
          echo "Live HTML marker:"
          curl --location --silent --show-error --max-time 20 \
            "https://app.zionflow.co.za/website-demo-builder/?deploydiag=$(date +%s)" \
            --output /tmp/zf-live-diag.html || true
          grep -oE 'share.js[^"]*|REQUEST THIS WEBSITE' /tmp/zf-live-diag.html | head -5 || true
      - name: Verify published WhatsApp request wiring
        if: github.ref == 'refs/heads/main'
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 20 \
              https://app.zionflow.co.za/website-demo-builder/ \
              --output /tmp/zf-demo-live.html &&
              curl --fail --location --silent --show-error --max-time 20 \
              https://app.zionflow.co.za/website-demo-builder/share.js \
              --output /tmp/zf-demo-live.js &&
              grep -q 'id="quoteLink"' /tmp/zf-demo-live.html &&
              grep -q 'ZIONFLOW_WHATSAPP_NUMBER' /tmp/zf-demo-live.js &&
              grep -q "window.open(url, '_blank')" /tmp/zf-demo-live.js; then
              echo 'Published Request button now opens ZionFlow WhatsApp.'
              exit 0
            fi
            echo "Publication pending (attempt ${attempt}/8)."
            sleep 20
          done
          echo 'Published WhatsApp change could not be verified.'
          exit 1
