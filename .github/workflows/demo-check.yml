name: Check Website Demo
on:
  push:
    branches: [main]
    paths:
      - "website-demo-builder/**"
      - "tests/demo-check.mjs"
      - "tests/demo-submission-flow.mjs"
      - ".github/workflows/demo-check.yml"
  pull_request:
    paths:
      - "website-demo-builder/**"
      - "tests/demo-check.mjs"
      - "tests/demo-submission-flow.mjs"
      - ".github/workflows/demo-check.yml"

permissions:
  contents: read

jobs:
  demo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check demo JavaScript and integration
        run: |
          node tests/demo-check.mjs
          node tests/demo-submission-flow.mjs
